name: CI

# Run on pull requests only: the merge gate is the pull_request check.
# Running on push too created a second run per commit (CI / test (push)) that
# did not match the branch-protection context "CI / test", leaving a permanently
# "expected/waiting" status on PRs.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package (deps included)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run offline test suite
        run: pytest -q

      - name: Build distribution (sanity)
        run: |
          pip install build
          python -m build --wheel
